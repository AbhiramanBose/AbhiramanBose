name: Update UTC Time

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-time:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README UTC + IST time
        run: |
          python - <<'PY'
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          def replace_marker(src, start, end, value):
              i = src.find(start)
              j = src.find(end)
              if i == -1 or j == -1 or j <= i:
                  raise SystemExit(f"Marker not found: {start} ... {end}")
              return src[: i + len(start)] + value + src[j:]

          now_utc = datetime.now(timezone.utc)
          now_ist = now_utc.astimezone(timezone(timedelta(hours=5, minutes=30)))

          utc_value = now_utc.strftime("%Y-%m-%d %H:%M UTC")
          ist_value = now_ist.strftime("%Y-%m-%d %H:%M IST")

          text = replace_marker(text, "<!--UTC_TIME-->", "<!--/UTC_TIME-->", utc_value)
          text = replace_marker(text, "<!--IST_TIME-->", "<!--/IST_TIME-->", ist_value)

          readme.write_text(text, encoding="utf-8")
          print("Updated:", utc_value, "|", ist_value)
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update UTC and IST time"
          git push
