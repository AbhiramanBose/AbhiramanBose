name: update-time

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-time:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README UTC + IST
        run: |
          python - <<'PY'
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          p = Path("README.md")
          text = p.read_text(encoding="utf-8")

          utc = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          ist = datetime.now(timezone.utc).astimezone(
              timezone(timedelta(hours=5, minutes=30))
          ).strftime("%Y-%m-%d %H:%M IST")

          block = (
              "### 🕒 Live Time\n\n"
              f"Current UTC Time: <!--UTC_TIME-->{utc}<!--/UTC_TIME-->  \n"
              f"Current IST Time: <!--IST_TIME-->{ist}<!--/IST_TIME-->\n"
          )

          if "<!--UTC_TIME-->" in text and "<!--/UTC_TIME-->" in text and "<!--IST_TIME-->" in text and "<!--/IST_TIME-->" in text:
              import re
              text = re.sub(r"<!--UTC_TIME-->.*?<!--/UTC_TIME-->", f"<!--UTC_TIME-->{utc}<!--/UTC_TIME-->", text, flags=re.S)
              text = re.sub(r"<!--IST_TIME-->.*?<!--/IST_TIME-->", f"<!--IST_TIME-->{ist}<!--/IST_TIME-->", text, flags=re.S)
          else:
              text += "\n\n---\n\n" + block

          p.write_text(text, encoding="utf-8")
          print("Updated:", utc, "|", ist)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update UTC and IST time"
          git push
