name: update-time

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update UTC + IST markers
        run: |
          python - <<'PY'
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          import re

          p = Path("README.md")
          text = p.read_text(encoding="utf-8")

          now_utc = datetime.now(timezone.utc)
          now_ist = now_utc.astimezone(timezone(timedelta(hours=5, minutes=30)))

          utc = now_utc.strftime("%Y-%m-%d %H:%M UTC")
          ist = now_ist.strftime("%Y-%m-%d %H:%M IST")

          text = re.sub(r"<!--UTC_TIME-->.*?<!--/UTC_TIME-->", f"<!--UTC_TIME-->{utc}<!--/UTC_TIME-->", text, flags=re.S)
          text = re.sub(r"<!--IST_TIME-->.*?<!--/IST_TIME-->", f"<!--IST_TIME-->{ist}<!--/IST_TIME-->", text, flags=re.S)

          p.write_text(text, encoding="utf-8")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update UTC and IST time"
          git push
