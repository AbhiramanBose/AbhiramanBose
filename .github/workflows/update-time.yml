name: Update UTC Time

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README time
        run: |
          NOW="$(date -u '+%Y-%m-%d %H:%M UTC')"
          sed -i "s|<!--UTC_TIME-->.*<!--/UTC_TIME-->|<!--UTC_TIME-->$NOW<!--/UTC_TIME-->|" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update UTC time"
          git push
