name: update-readme-times

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-update
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update UTC/IST badges + stats refresh
        run: |
          python - <<'PY'
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          import re

          p = Path("README.md")
          text = p.read_text(encoding="utf-8")

          now_utc = datetime.now(timezone.utc)
          now_ist = now_utc.astimezone(timezone(timedelta(hours=5, minutes=30)))

          utc_badge = now_utc.strftime("%Y--%m--%d_%H--%M_UTC")
          ist_badge = now_ist.strftime("%Y--%m--%d_%H--%M_IST")
          refresh = now_utc.strftime("%Y-%m-%d %H:%M UTC")

          utc_img = f'<img src="https://img.shields.io/badge/UTC-{utc_badge}-black?style=plastic" alt="UTC Time" />'
          ist_img = f'<img src="https://img.shields.io/badge/IST-{ist_badge}-black?style=plastic" alt="IST Time" />'

          text = re.sub(
              r"(<!--UTC_BADGE_START-->)(.*?)(<!--UTC_BADGE_END-->)",
              rf"\1\n  {utc_img}\n  \3",
              text,
              flags=re.S,
          )
          text = re.sub(
              r"(<!--IST_BADGE_START-->)(.*?)(<!--IST_BADGE_END-->)",
              rf"\1\n  {ist_img}\n  \3",
              text,
              flags=re.S,
          )
          text = re.sub(
              r"<!--STATS_REFRESH-->.*?<!--/STATS_REFRESH-->",
              f"<!--STATS_REFRESH-->{refresh}<!--/STATS_REFRESH-->",
              text,
              flags=re.S,
          )

          p.write_text(text, encoding="utf-8")
          PY

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update README UTC/IST badges and refresh time"
          git push
